name: sanctum

services:
  sanctum-tor:
    image: ghcr.io/deymosh/tor:latest
    container_name: sanctum-tor
    # tor refuses to run unless its data directory is owned by toruser and
    # mode 0700, and a bind mount arrives root-owned on most hosts. Start as
    # root, fix the mount once, then drop to toruser for tor itself.
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - chown 1000:1000 /var/lib/tor && chmod 700 /var/lib/tor && exec setpriv --reuid 1000 --regid 1000 --clear-groups tor -f /etc/tor/torrc
    restart: always
    healthcheck:
      test: ["CMD", "bash", "-c", "grep -q 'Bootstrapped 100%' /var/lib/tor/tor.log"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ./tor/torrc:/etc/tor/torrc:ro
      - ./tor/data:/var/lib/tor
    networks:
      - sanctum-network

  sanctum-relay:
    # falls back to a local build when the image is not available yet
    image: ghcr.io/deymosh/sanctum:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sanctum-relay
    volumes:
      - ./.env:/app/.env
      # everything the relay writes lives under ./data
      - ./data/db:/app/db
      - ./data/blossom:/app/blossom
      - ./data/state:/app/state
      - ./relays_import.json:/app/relays_import.json
      - ./relays_blastr.json:/app/relays_blastr.json
      - ./whitelisted_npubs.json:/app/whitelisted_npubs.json
      - ./blacklisted_npubs.json:/app/blacklisted_npubs.json
    env_file:
      - .env
    # what the admin console changes and the dashboard's history; /app itself is
    # not writable by the relay and would not survive a rebuild
    environment:
      MANAGEMENT_STATE_FILE: /app/state/management.json
      ANALYTICS_STATE_FILE: /app/state/metrics.json
    networks:
      - sanctum-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3355/outbox", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  sanctum-network:
    driver: bridge
