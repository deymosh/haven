name: sanctum

services:
  sanctum-tor:
    image: ghcr.io/deymosh/tor:latest
    container_name: sanctum-tor
    restart: always
    # the image bundles bash and timeout for exactly this healthcheck
    healthcheck:
      test: ["CMD", "timeout", "5", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/9050"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./tor/torrc:/etc/tor/torrc:ro
      - ./tor/data:/data/.tor
    networks:
      - sanctum-network

  sanctum-relay:
    # falls back to a local build when the image is not available yet
    image: ghcr.io/deymosh/sanctum:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sanctum-relay
    # loopback only: reachable from the host (browser, reverse proxy) but not
    # exposed publicly; the tor hidden service needs no host port at all
    ports:
      - "127.0.0.1:3355:3355"
    volumes:
      - ./.env:/app/.env
      # everything the relay writes lives under ./data
      - ./data/db:/app/db
      - ./data/blossom:/app/blossom
      - ./data/state:/app/state
      - ./relays_import.json:/app/relays_import.json
      - ./relays_blastr.json:/app/relays_blastr.json
      - ./whitelisted_npubs.json:/app/whitelisted_npubs.json
      - ./blacklisted_npubs.json:/app/blacklisted_npubs.json
    env_file:
      - .env
    # what the admin console changes and the dashboard's history; /app itself is
    # not writable by the relay and would not survive a rebuild
    environment:
      MANAGEMENT_STATE_FILE: /app/state/management.json
      ANALYTICS_STATE_FILE: /app/state/metrics.json
    networks:
      - sanctum-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3355/outbox", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  sanctum-network:
    driver: bridge
